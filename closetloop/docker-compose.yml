services:
  web:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/app/frontend
    
    env_file: .env
    depends_on:
      - db
    
    db:
    image: postgres:13
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb

      volumes:
      - db_data:/var/lib/postgresql/data

      ports:
      - "5432:5432"
volumes:
  db_data:
